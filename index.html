<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEART LOVE FM - Glass Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #000; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            color: white; 
        }

        #bg-image {
            position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
            background-image: url('https://i.pinimg.com/736x/01/2d/86/012d86f7b9f3944697332f146603a1f7.jpg');
            background-size: cover; background-position: center;
            filter: blur(65px) brightness(0.25); 
            z-index: 0; 
            transition: background-image 2s ease;
        }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        #player-ui { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
        
        .art-zone { position: relative; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; }
        
        #main-aura { 
            position: absolute; width: 100%; height: 100%; border-radius: 50%; 
            filter: blur(60px); opacity: 0.5; z-index: 3; 
            transition: background 2s ease; 
        }

        #album-art { 
            width: 220px; height: 220px; border-radius: 50%; object-fit: cover; 
            border: 3px solid rgba(255,255,255,0.15); z-index: 5; 
            transition: transform 0.1s; background: #111; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #info { margin-top: 25px; min-height: 110px; }
        #track-title { font-size: 26px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 2px 15px rgba(0,0,0,0.8); transition: color 1.5s ease; }
        #artist-name { font-size: 13px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.7; }

        /* PANEL DE CONTROL */
        .controls { 
            margin-top: 25px; display: flex; align-items: center; gap: 20px; 
            background: rgba(255, 255, 255, 0.07); 
            padding: 15px 35px; border-radius: 50px; 
            backdrop-filter: blur(25px) saturate(160%); 
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transition: all 1.5s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* BOTÓN PLAY CON FIGURAS TRANSPARENTES/BLANCAS */
        #play-btn { 
            background: rgba(255, 255, 255, 0.1); 
            color: rgba(255, 255, 255, 0.9); /* Icono casi transparente/blanco */
            border: 1px solid rgba(255, 255, 255, 0.2); 
            width: 55px; height: 55px; 
            border-radius: 50%; cursor: pointer; font-size: 22px; 
            transition: all 0.4s ease; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        #play-btn:hover { 
            background: rgba(255, 255, 255, 0.2); 
            transform: scale(1.05);
            color: #fff;
        }

        #vol { 
            accent-color: #fff; width: 80px; cursor: pointer;
            transition: accent-color 1.5s ease;
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <canvas id="main-canvas"></canvas>

    <div id="player-ui">
        <div class="art-zone">
            <div id="main-aura"></div>
            <img id="album-art" src="https://i.pinimg.com/736x/01/2d/86/012d86f7b9f3944697332f146603a1f7.jpg" crossorigin="anonymous">
        </div>
        <div id="info">
            <h1 id="track-title">HEART LOVE FM</h1>
            <h2 id="artist-name">CONECTANDO...</h2>
        </div>
        <div class="controls" id="controls-panel">
            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.7">
            <button id="play-btn"><i class="fa-solid fa-play"></i></button>
        </div>
    </div>

    <audio id="stream" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('stream');
        const playBtn = document.getElementById('play-btn');
        const art = document.getElementById('album-art');
        const bgImg = document.getElementById('bg-image');
        const trackTxt = document.getElementById('track-title');
        const artistTxt = document.getElementById('artist-name');
        const volSlider = document.getElementById('vol');
        const controlsPanel = document.getElementById('controls-panel');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');

        let audioCtx, analyser, dataArray, isPlaying = false;
        let particles = [];
        let accentColor = "255, 255, 255";
        let visualMode = 0; 
        let currentShape = 'circle';
        let transitionFactor = 0;

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<160; i++) {
                particles.push({ 
                    a: (i / 160) * Math.PI * 2, 
                    oR: 135 + Math.random() * 95, 
                    s: 0.002 + Math.random() * 0.004,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function updateVisualsByLetter(title) {
            const charCode = title.charCodeAt(0) || 65;
            visualMode = charCode % 15;
            const shapes = ['circle', 'heart', 'star', 'diamond'];
            currentShape = shapes[charCode % 4];
            transitionFactor = 0;
        }

        function drawShape(x, y, size, shape) {
            ctx.beginPath();
            if(shape === 'heart') {
                ctx.font = `${size * 2.5}px Arial`; ctx.fillText('♥', x - size, y + size);
            } else if(shape === 'star') {
                ctx.font = `${size * 2.5}px Arial`; ctx.fillText('★', x - size, y + size);
            } else if(shape === 'diamond') {
                ctx.moveTo(x, y - size); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); ctx.closePath(); ctx.fill();
            } else {
                ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function draw() {
            requestAnimationFrame(draw);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(transitionFactor < 1) transitionFactor += 0.01;

            let avg = 0;
            if(isPlaying && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                avg = dataArray.reduce((a,b) => a+b) / dataArray.length;
            }

            const rect = art.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            particles.forEach((p, i) => {
                const freq = dataArray ? (dataArray[i % dataArray.length] / 255) : 0;
                p.a += p.s + (freq * 0.015);
                let d = p.oR + (freq * 75);
                let x, y;

                switch(visualMode) {
                    case 0: x = cx + Math.cos(p.a) * d; y = cy + Math.sin(p.a) * d; break;
                    case 1: x = cx + Math.cos(p.a) * d; y = cy + Math.sin(p.a) * (d*0.5); break;
                    case 2: x = cx + Math.cos(p.a) * d + Math.sin(p.phase)*20; y = cy + Math.sin(p.a) * d; break;
                    case 3: x = cx + Math.cos(p.a) * (d + Math.sin(Date.now()*0.003)*30); y = cy + Math.sin(p.a) * (d + Math.sin(Date.now()*0.003)*30); break;
                    case 4: x = cx + Math.cos(p.a*2) * d; y = cy + Math.sin(p.a) * d; break;
                    case 5: let t = p.a; x = cx + 16*Math.pow(Math.sin(t),3)*(d/15); y = cy - (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*(d/15); break;
                    case 6: x = cx + Math.cos(p.a) * d * Math.cos(p.a*3); y = cy + Math.sin(p.a) * d * Math.cos(p.a*3); break;
                    case 7: x = cx + Math.cos(p.a) * d; y = cy + Math.sin(p.a) * d + (freq*55); break;
                    case 8: x = cx + Math.cos(p.a) * (d * (i/160)); y = cy + Math.sin(p.a) * (d * (i/160)); break;
                    case 9: x = cx + Math.cos(p.a) * d * (1+0.2*Math.sin(p.a*5)); y = cy + Math.sin(p.a) * d * (1+0.2*Math.sin(p.a*5)); break;
                    case 10: x = cx + Math.cos(p.a) * d; y = cy + Math.sin(p.a * 2) * d * 0.5; break;
                    case 11: x = cx + Math.tan(p.a) * 15 + Math.cos(p.a)*d; y = cy + Math.sin(p.a)*d; break;
                    case 12: x = cx + Math.cos(p.a) * d; y = cy + Math.sin(p.a) * d * Math.sin(Date.now()*0.001); break;
                    case 13: x = cx + Math.cos(p.a) * (d + i%10 * 6); y = cy + Math.sin(p.a) * (d + i%10 * 6); break;
                    case 14: x = cx + Math.cos(p.a + freq) * d; y = cy + Math.sin(p.a - freq) * d; break;
                    default: x = cx + Math.cos(p.a) * d; y = cy + Math.sin(p.a) * d;
                }

                ctx.fillStyle = i % 2 === 0 ? `rgba(255,255,255,${0.6 + transitionFactor/3})` : `rgb(${accentColor})`;
                drawShape(x, y, 1.5 + (freq * 5), currentShape);
            });
            if(isPlaying) art.style.transform = `scale(${1 + (avg/300)})`;
        }

        function updateUIColors(r, g, b) {
            accentColor = `${r}, ${g}, ${b}`;
            const rgb = `rgb(${accentColor})`;
            trackTxt.style.color = rgb;
            
            // Iconos y bordes reaccionan al color pero son claros y sin negro
            playBtn.style.color = `rgba(255,255,255,0.9)`; 
            playBtn.style.borderColor = `rgba(${accentColor}, 0.5)`;
            playBtn.style.textShadow = `0 0 10px ${rgb}`;
            
            volSlider.style.accentColor = rgb;
            controlsPanel.style.borderColor = `rgba(${accentColor}, 0.35)`;
            document.getElementById('main-aura').style.background = `radial-gradient(circle, rgba(${accentColor},0.6) 0%, transparent 70%)`;
        }

        async function toggleRadio() {
            if (!isPlaying) {
                playBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    const src = audioCtx.createMediaElementSource(audio);
                    src.connect(analyser); analyser.connect(audioCtx.destination);
                    analyser.fftSize = 64;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                audio.src = "https://stream.zeno.fm/cr8evht2huruv";
                audio.load();
                try { await audio.play(); isPlaying = true; playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; } catch(e) {}
            } else { audio.pause(); audio.src = ""; isPlaying = false; playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; }
        }

        function startMetadata() {
            const es = new EventSource('https://api.zeno.fm/mounts/metadata/subscribe/cr8evht2huruv');
            es.onmessage = async (e) => {
                const data = JSON.parse(e.data);
                if(data.streamTitle) {
                    const [artist, song] = data.streamTitle.split(' - ');
                    const finalSong = song || "En Vivo";
                    trackTxt.innerText = finalSong;
                    artistTxt.innerText = artist || "HEART LOVE FM";
                    updateVisualsByLetter(finalSong);
                    try {
                        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(data.streamTitle)}&limit=1&entity=song`);
                        const itunes = await res.json();
                        if(itunes.results.length > 0) {
                            const img = itunes.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                            art.src = img;
                            bgImg.style.backgroundImage = `url('${img}')`;
                            const tempImg = new Image(); tempImg.crossOrigin = "Anonymous"; tempImg.src = img;
                            tempImg.onload = () => {
                                const tempCanvas = document.createElement('canvas'); const tCtx = tempCanvas.getContext('2d');
                                tempCanvas.width = 1; tempCanvas.height = 1; tCtx.drawImage(tempImg, 0, 0, 1, 1);
                                const d = tCtx.getImageData(0,0,1,1).data;
                                updateUIColors(d[0], d[1], d[2]);
                            };
                        }
                    } catch(err) {}
                }
            };
        }

        playBtn.onclick = toggleRadio;
        volSlider.oninput = (e) => audio.volume = e.target.value;
        window.onresize = initParticles;
        initParticles(); draw(); startMetadata();
    </script>
</body>
</html>
