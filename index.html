<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEART LOVE FM - Status</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            border: 1px solid #333;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            max-width: 400px;
        }
        h1 {
            color: #ff4d4d; /* Un rojo romántico pero de alerta */
            font-size: 48px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #ccc;
        }
        .status-tag {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 15px;
            background-color: #444;
            color: #ff4d4d;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .heart {
            color: #ff4d4d;
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤</div>
        <h1>Oops!</h1>
        <p>Page not found error. Contact the page owner if you cannot find or the website does not load.</p>
        <div class="status-tag">{temporarily closed}</div>
    </div>

</body>
</html>
