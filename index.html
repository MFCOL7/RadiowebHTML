<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEARTLOVE FM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; 
            background: linear-gradient(180deg, #1a0b2e 0%, #6e3a5e 50%, #ff9a8b 100%);
            color: white;
        }

        #canvas-env { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #main-player { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        .visual-core { position: relative; width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; }
        
        #aura {
            position: absolute; width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            filter: blur(30px); opacity: 0.5; transition: transform 0.1s ease-out;
        }

        #album-art {
            width: 240px; height: 240px; border-radius: 50%; object-fit: cover;
            border: 6px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5); z-index: 5;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #info { text-align: center; margin-top: 35px; min-height: 80px; }
        #track-title { font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 5px; text-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #artist-name { font-size: 13px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.7; }

        .controls {
            margin-top: 40px; display: flex; align-items: center; gap: 25px;
            background: rgba(255, 255, 255, 0.1); padding: 18px 40px;
            border-radius: 100px; backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #play-btn {
            background: #fff; color: #ff4b2b; border: none; width: 55px; height: 55px;
            border-radius: 50%; font-size: 22px; cursor: pointer; transition: 0.3s;
        }
        #play-btn:hover { transform: scale(1.1); box-shadow: 0 0 25px white; }
        input[type=range] { accent-color: white; width: 90px; cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body>

    <canvas id="canvas-env"></canvas>

    <div id="main-player">
        <div class="visual-core">
            <div id="aura"></div>
            <img id="album-art" src="https://i.pinimg.com/736x/01/2d/86/012d86f7b9f3944697332f146603a1f7.jpg" alt="Art">
        </div>

        <div id="info">
            <h1 id="track-title">Conectando...</h1>
            <h2 id="artist-name">HEART LOVE FM</h2>
        </div>

        <div class="controls">
            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.7">
            <button id="play-btn"><i class="fa-solid fa-play"></i></button>
        </div>
    </div>

    <audio id="stream" crossorigin="anonymous"></audio>

    <script>
        const streamUrl = "https://stream.zeno.fm/cr8evht2huruv";
        const defaultArt = "https://i.pinimg.com/736x/01/2d/86/012d86f7b9f3944697332f146603a1f7.jpg";
        const audio = document.getElementById('stream');
        const playBtn = document.getElementById('play-btn');
        const art = document.getElementById('album-art');
        const aura = document.getElementById('aura');
        const canvas = document.getElementById('canvas-env');
        const ctx = canvas.getContext('2d');

        let audioCtx, analyser, dataArray, isPlaying = false;
        let particles = [];

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.5 + 0.2,
                    opacity: Math.random()
                });
            }
        }

        function draw() {
            requestAnimationFrame(draw);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y -= p.speed;
                if(p.y < -10) p.y = canvas.height + 10;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });

            if(isPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let avg = dataArray.reduce((a,b) => a+b) / dataArray.length;
                let intensity = avg / 180;
                aura.style.transform = `scale(${1 + intensity})`;
                aura.style.opacity = 0.3 + intensity;
                art.style.transform = `scale(${1 + (intensity * 0.15)})`;
            }
        }

        async function playRadio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const src = audioCtx.createMediaElementSource(audio);
                src.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 32;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            audio.src = streamUrl; 
            audio.load();
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            });
        }

        playBtn.onclick = () => {
            if (!isPlaying) playRadio();
            else {
                audio.pause();
                audio.src = "";
                isPlaying = false;
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        };

        function startMetadata() {
            const es = new EventSource('https://api.zeno.fm/mounts/metadata/subscribe/cr8evht2huruv');
            es.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if(data.streamTitle) {
                    const parts = data.streamTitle.split(' - ');
                    const artist = (parts[0] || "Heart Love").trim();
                    const song = (parts[1] || "FM").trim();
                    document.getElementById('track-title').innerText = song;
                    document.getElementById('artist-name').innerText = artist;
                    updateArt(artist, song);
                }
            };
        }

        async function updateArt(artist, song) {
            // LIMPIEZA EXTREMA PARA BUSCAR LA CARÁTULA CORRECTA
            let cleanArtist = artist.replace(/radio|fm|live|oficial|estéreo/gi, '').trim();
            let cleanSong = song.split('(')[0].split('-')[0].split('[')[0].trim();
            
            const query = encodeURIComponent(`${cleanArtist} ${cleanSong}`);
            try {
                // Buscamos solo canciones para evitar resultados raros
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&limit=1&entity=song`);
                const data = await res.json();
                
                if(data.results.length > 0) {
                    art.src = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                } else {
                    art.src = defaultArt; // Si no hay nada claro, pone tu imagen de anime
                }
            } catch(e) {
                art.src = defaultArt;
            }
        }

        document.getElementById('vol').oninput = (e) => audio.volume = e.target.value;
        window.onresize = initParticles;
        initParticles();
        draw();
        startMetadata();
    </script>
</body>
</html>
